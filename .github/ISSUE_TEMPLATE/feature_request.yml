name: Feature request / 功能建议
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem / 想解决的问题}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal / 建议方案}
  - type: textarea
    id: privacy
    attributes: {label: Privacy impact / 隐私影响, description: "What new data would be captured, stored or sent? 会新增采集、保存或发送哪些数据？"}
