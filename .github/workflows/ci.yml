name: CI

# Basic checks on every push and pull request: fast, and only one macOS job (Rust core, ~3 minutes; its tests use
# afconvert). The full macOS app suite takes long, waits for scarce macOS runners and has been flaky under load, so it
# runs only when started by hand (Actions → CI → Run workflow). Run it locally with apps/macos/script/test.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the full macOS app tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Public speech samples
        run: sh services/voice/scripts/fetch_samples.sh
      - name: Test
        working-directory: core
        run: cargo test --workspace --locked

  docs:
    name: Docs
    # Links resolve, specs and decisions exist in both languages and are listed in docs/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: python3 scripts/check_docs.py

  licenses:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check licenses bans sources

  macos:
    # Keeps the name the branch protection requires; a skipped job counts as passed there.
    name: macOS app
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Agent extension dependencies
        run: npm ci --prefix agents/pi-extension --ignore-scripts
      - name: Test
        run: CANDID_PI_NODE="$(command -v node)" apps/macos/script/test.sh

  voice:
    name: Voice service
    # Linux, without the Apple-only MLX packages: the tests use synthetic models, and the two that need MLX skip.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        run: |
          grep -v '^mlx' services/voice/asr/requirements-speaker.lock.txt > /tmp/voice-linux.txt
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python /tmp/voice-linux.txt
          uv pip install --python .venv/bin/python pytest httpx
          .venv/bin/python -m pytest -q services/voice/tests

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --config .gitleaks.toml -v
