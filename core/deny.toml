# cargo-deny policy: permissive licenses only (plus file-level MPL-2.0), crates.io only.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0", "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# libwebp-sys declares MIT for its bindings; the vendored libwebp it compiles in is BSD-3-Clause.
[[licenses.clarify]]
crate = "libwebp-sys"
expression = "MIT AND BSD-3-Clause"
license-files = [{ path = "vendor/COPYING", hash = 0x7272837f }]
