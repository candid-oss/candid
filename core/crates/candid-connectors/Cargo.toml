[package]
name = "candid-connectors"
description = "Ingest connectors of the Candid core: mail (Mail.app data, IMAP via email-lib) and browser history (import off)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
candid-store.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
# MIME: multipart, QP/base64, RFC 2047 and every legacy charset through encoding_rs (full_encoding).
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
# himalaya's library (pimalaya), IMAP only; reads with EXAMINE + BODY.PEEK and never changes flags.
email-lib = { version = "=0.27.0", default-features = false, features = ["imap", "tokio-rustls"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
# Same versions email-lib pins; only for IMAP request types, mailbox name encoding and the in-memory password.
imap-client = "=0.3.1"
utf7-imap = "=0.3.2"
secret = { package = "secret-lib", version = "=1.0.0", default-features = false }
chrono.workspace = true

[dev-dependencies]
# Encodes synthetic fixtures into legacy charsets; already in the tree through mail-parser.
encoding_rs = "0.8.44"
base64.workspace = true
