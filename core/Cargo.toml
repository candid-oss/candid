[workspace]
resolver = "2"
members = [
    "crates/candid-store",
    "crates/candid-service",
    "crates/candid-cli",
    "crates/candid-metrics",
    "crates/candid-connectors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
candid-store = { path = "crates/candid-store" }
candid-service = { path = "crates/candid-service" }
candid-connectors = { path = "crates/candid-connectors" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
unicode-normalization = "0.1"
getrandom = "0.2"
base64 = "0.22"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
